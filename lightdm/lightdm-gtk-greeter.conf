# @NAME@ LightDM GTK greeter configuration.
#
# Install to /usr/local/etc/lightdm/lightdm-gtk-greeter.conf (BSD prefixes
# may differ; see README.md). Paths assume /usr/local/share/@NAME_LOWER@/.

[greeter]
background=/usr/local/share/@NAME_LOWER@/lightdm/greeter-1920x1080.png
theme-name=Adwaita-dark
default-user-image=#@NAME_LOWER@-logo
icon-theme-name=hicolor
font-name=DejaVu Sans 11
indicators=~clock;~spacer;~layout;~session;~power
clock-format=%a %d %b, %H:%M
