# @NAME@ LightDM GTK greeter configuration.
#
# Install to /usr/local/etc/lightdm/lightdm-gtk-greeter.conf (FreeBSD,
# DragonFly; /etc/lightdm/ on illumos distributions that ship LightDM).
# The greeter cannot place free text, so the identity line is stamped on
# the background (render.sh --identity). The colours come from the
# @NAME_LOWER@-greeter GTK theme (greeter-gtk.css, installed as
# <prefix>/share/themes/@NAME_LOWER@-greeter/gtk-3.0/gtk.css).

[greeter]
background=@SHARE_DIR@/lightdm/greeter-1920x1080.png
user-background=false
theme-name=@NAME_LOWER@-greeter
icon-theme-name=hicolor
font-name=@FONT@ 11
default-user-image=#@NAME_LOWER@-logo
position=50%,center 50%,center
indicators=~clock;~spacer;~layout;~session;~power
clock-format=%a %d %b, %H:%M
