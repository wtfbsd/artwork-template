<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ loader brand, 400x100: the name drawn above the boot menu on a
     framebuffer console. Transparent background (the loader paints black
     behind it). Tokens are substituted by scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <title>@NAME@ loader brand</title>
  <g transform="translate(6,14) scale(0.160714)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@PRIMARY@"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@ACCENT@"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
  </g>
  <text x="96" y="66" font-family="DejaVu Sans, sans-serif" font-size="44" font-weight="bold" fill="#@LIGHT@">@NAME@</text>
</svg>
