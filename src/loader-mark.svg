<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ loader logo, 240x200: the mark alone, drawn beside the boot menu
     on a framebuffer console. Transparent background. Tokens are
     substituted by scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <title>@NAME@ loader logo</title>
  <g transform="translate(30,10) scale(0.401786)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@PRIMARY@"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@ACCENT@"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
  </g>
</svg>
