<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ loader logo, 480x200, two colors on a solid dark background
     (PRIMARY + LIGHT over DARK). Tokens are substituted by scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200">
  <title>@NAME@ loader logo</title>
  <rect x="0" y="0" width="480" height="200" fill="#@DARK@"/>
  <g transform="translate(28,32) scale(0.303571)">
    <rect x="0" y="0" width="448" height="448" rx="104" ry="104" fill="#@PRIMARY@"/>
    <rect x="80" y="104" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="200" width="208" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
    <rect x="80" y="296" width="288" height="48" rx="24" ry="24" fill="#@LIGHT@"/>
  </g>
  <text x="192" y="112" font-family="DejaVu Sans, sans-serif" font-size="36" font-weight="bold" fill="#@LIGHT@">@NAME@</text>
</svg>
