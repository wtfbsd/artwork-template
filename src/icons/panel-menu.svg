  <title>@NAME@ panel menu</title>
  <rect x="0" y="0" width="512" height="512" rx="88" ry="88" fill="#@DARK2@"/>
  <rect x="104" y="120" width="304" height="56" rx="28" ry="28" fill="#@LIGHT@"/>
  <rect x="104" y="228" width="304" height="56" rx="28" ry="28" fill="#@LIGHT@"/>
  <rect x="104" y="336" width="304" height="56" rx="28" ry="28" fill="#@ACCENT@"/>
</svg>
