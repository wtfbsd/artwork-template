<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ installer sidebar panel, 200x600. Cyberpunk variant. Tokens are substituted by
     scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 600" width="200" height="600">
  <title>@NAME@ installer sidebar</title>
  <defs>
    <g id="cpmark">
      <rect x="9" y="9" width="430" height="430" rx="64" ry="64" fill="#@DARK2@" stroke="#@PRIMARY@" stroke-width="18"/>
      <g opacity="0.8">
        <rect x="66" y="104" width="288" height="48" rx="4" fill="#@PRIMARY@"/>
        <rect x="94" y="296" width="288" height="48" rx="4" fill="#@ACCENT@"/>
      </g>
      <rect x="80" y="104" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="108" y="200" width="208" height="48" rx="4" fill="#@ACCENT@"/>
      <rect x="80" y="214" width="60" height="20" fill="#@PRIMARY@"/>
      <rect x="80" y="296" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="372" y="66" width="22" height="22" fill="#@HIGHLIGHT@"/>
      <rect x="54" y="370" width="14" height="14" fill="#@HIGHLIGHT@"/>
    </g>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#000000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <defs><linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#@DARK@"/><stop offset="1" stop-color="#@DARK2@"/></linearGradient></defs>
  <rect x="0" y="0" width="200" height="600" fill="url(#sbg)"/>
  <use xlink:href="#cpmark" transform="translate(40,40) scale(0.267857)"/>
  <defs>
    <clipPath id="slice"><rect x="-4000" y="200.5" width="12000" height="3.3"/></clipPath>
  </defs>
  <g font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="bold" text-anchor="middle">
    <text x="98" y="208" fill="#@PRIMARY@" fill-opacity="0.9">@NAME@</text>
    <text x="102" y="208" fill="#@ACCENT@" fill-opacity="0.9">@NAME@</text>
    <text x="100" y="208" fill="#@LIGHT@">@NAME@</text>
    <g clip-path="url(#slice)">
      <text x="102" y="208" fill="#@ACCENT@">@NAME@</text>
    </g>
  </g>
  <rect x="56" y="228" width="88" height="4" fill="#@ACCENT@"/>
  <g stroke="#@PRIMARY@" stroke-opacity="0.25" stroke-width="1"><line x1="10" y1="300" x2="10" y2="600"/><line x1="30" y1="300" x2="30" y2="600"/><line x1="50" y1="300" x2="50" y2="600"/><line x1="70" y1="300" x2="70" y2="600"/><line x1="90" y1="300" x2="90" y2="600"/><line x1="110" y1="300" x2="110" y2="600"/><line x1="130" y1="300" x2="130" y2="600"/><line x1="150" y1="300" x2="150" y2="600"/><line x1="170" y1="300" x2="170" y2="600"/><line x1="190" y1="300" x2="190" y2="600"/><line x1="0" y1="310" x2="200" y2="310"/><line x1="0" y1="330" x2="200" y2="330"/><line x1="0" y1="350" x2="200" y2="350"/><line x1="0" y1="370" x2="200" y2="370"/><line x1="0" y1="390" x2="200" y2="390"/><line x1="0" y1="410" x2="200" y2="410"/><line x1="0" y1="430" x2="200" y2="430"/><line x1="0" y1="450" x2="200" y2="450"/><line x1="0" y1="470" x2="200" y2="470"/><line x1="0" y1="490" x2="200" y2="490"/><line x1="0" y1="510" x2="200" y2="510"/><line x1="0" y1="530" x2="200" y2="530"/><line x1="0" y1="550" x2="200" y2="550"/><line x1="0" y1="570" x2="200" y2="570"/><line x1="0" y1="590" x2="200" y2="590"/></g>
  <rect x="0" y="0" width="200" height="600" fill="url(#scan)"/>
</svg>
