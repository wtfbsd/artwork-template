<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ installer header banner, 800x96. Cyberpunk variant. Tokens are substituted by
     scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 96" width="800" height="96">
  <title>@NAME@ installer header</title>
  <defs>
    <g id="cpmark">
      <rect x="9" y="9" width="430" height="430" rx="64" ry="64" fill="#@DARK2@" stroke="#@PRIMARY@" stroke-width="18"/>
      <g opacity="0.8">
        <rect x="66" y="104" width="288" height="48" rx="4" fill="#@PRIMARY@"/>
        <rect x="94" y="296" width="288" height="48" rx="4" fill="#@ACCENT@"/>
      </g>
      <rect x="80" y="104" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="108" y="200" width="208" height="48" rx="4" fill="#@ACCENT@"/>
      <rect x="80" y="214" width="60" height="20" fill="#@PRIMARY@"/>
      <rect x="80" y="296" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="372" y="66" width="22" height="22" fill="#@HIGHLIGHT@"/>
      <rect x="54" y="370" width="14" height="14" fill="#@HIGHLIGHT@"/>
    </g>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="1" fill="#000000" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="800" height="96" fill="#@DARK2@"/>
  <use xlink:href="#cpmark" transform="translate(16,16) scale(0.142857)"/>
  <defs>
    <clipPath id="slice"><rect x="-4000" y="49.1" width="12000" height="4.8"/></clipPath>
  </defs>
  <g font-family="DejaVu Sans Mono, monospace" font-size="32" font-weight="bold" text-anchor="start">
    <text x="102" y="60" fill="#@PRIMARY@" fill-opacity="0.9">@NAME@</text>
    <text x="106" y="60" fill="#@ACCENT@" fill-opacity="0.9">@NAME@</text>
    <text x="104" y="60" fill="#@LIGHT@">@NAME@</text>
    <g clip-path="url(#slice)">
      <text x="107" y="60" fill="#@ACCENT@">@NAME@</text>
    </g>
  </g>
  <defs><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#@PRIMARY@"/><stop offset="1" stop-color="#@ACCENT@"/></linearGradient></defs>
  <rect x="0" y="92" width="800" height="4" fill="url(#bar)"/>
  <rect x="0" y="0" width="800" height="96" fill="url(#scan)"/>
</svg>
