<?xml version="1.0" encoding="UTF-8"?>
<!-- @NAME@ loader brand, 400x100, transparent. Cyberpunk variant. Tokens are substituted by
     scripts/render.sh. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 100" width="400" height="100">
  <title>@NAME@ loader brand</title>
  <defs>
    <g id="cpmark">
      <rect x="9" y="9" width="430" height="430" rx="64" ry="64" fill="#@DARK2@" stroke="#@PRIMARY@" stroke-width="18"/>
      <g opacity="0.8">
        <rect x="66" y="104" width="288" height="48" rx="4" fill="#@PRIMARY@"/>
        <rect x="94" y="296" width="288" height="48" rx="4" fill="#@ACCENT@"/>
      </g>
      <rect x="80" y="104" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="108" y="200" width="208" height="48" rx="4" fill="#@ACCENT@"/>
      <rect x="80" y="214" width="60" height="20" fill="#@PRIMARY@"/>
      <rect x="80" y="296" width="288" height="48" rx="4" fill="#@LIGHT@"/>
      <rect x="372" y="66" width="22" height="22" fill="#@HIGHLIGHT@"/>
      <rect x="54" y="370" width="14" height="14" fill="#@HIGHLIGHT@"/>
    </g>
  </defs>
  <use xlink:href="#cpmark" transform="translate(6,14) scale(0.160714)"/>
  <defs>
    <clipPath id="slice"><rect x="-4000" y="51.0" width="12000" height="6.6"/></clipPath>
  </defs>
  <g font-family="DejaVu Sans Mono, monospace" font-size="44" font-weight="bold" text-anchor="start">
    <text x="90" y="66" fill="#@PRIMARY@" fill-opacity="0.9">@NAME@</text>
    <text x="94" y="66" fill="#@ACCENT@" fill-opacity="0.9">@NAME@</text>
    <text x="92" y="66" fill="#@LIGHT@">@NAME@</text>
    <g clip-path="url(#slice)">
      <text x="96" y="66" fill="#@ACCENT@">@NAME@</text>
    </g>
  </g>
</svg>
